<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapLink</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>SnapLink</h1>
    <p class="subtitle">Shorten any URL instantly</p>

    <form id="shorten-form">
      <div class="form-group">
        <label for="url-input">Long URL</label>
        <input type="text" id="url-input" placeholder="https://example.com/very/long/url" />
      </div>
      <div class="form-group">
        <label for="alias-input">Custom alias (optional)</label>
        <input type="text" id="alias-input" placeholder="my-link" />
      </div>
      <button type="submit">Shorten</button>
    </form>

    <div id="result" class="result hidden"></div>

    <h2>Your Links</h2>
    <table id="links-table">
      <thead>
        <tr>
          <th>Short URL</th>
          <th>Original URL</th>
          <th>Visits</th>
          <th>Created</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="links-body"></tbody>
    </table>
    <p id="empty-message" class="empty">No links yet. Create one above!</p>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
